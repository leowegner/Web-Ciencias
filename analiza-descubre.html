<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analiza y Descubre</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: linear-gradient(170deg, #0a0e27 0%, #1a1040 40%, #2d1b69 100%);
  font-family: 'Inter', sans-serif;
  color: #ffffff;
  overflow-x: hidden;
  position: relative;
}

/* Nebula corner gradients */
body::before, body::after {
  content: '';
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
body::before {
  top: -150px;
  right: -150px;
  background: radial-gradient(circle, rgba(200,50,150,0.12) 0%, transparent 70%);
}
body::after {
  bottom: -200px;
  left: -150px;
  background: radial-gradient(circle, rgba(180,60,200,0.10) 0%, transparent 70%);
}

#starfield {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 100%;
  margin: 0 auto;
  padding: 2vh 4vw 4vh;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Back button */
.back-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
  z-index: 10;
}
.back-btn:hover {
  color: #d4a843;
  border-color: rgba(212,168,67,0.4);
  background: rgba(212,168,67,0.1);
}
.back-btn svg { width: 16px; height: 16px; }

/* Title area */
.title-area {
  text-align: center;
  margin-top: 50px;
  margin-bottom: 10px;
}
.title {
  font-family: 'Cinzel', serif;
  font-size: clamp(32px, 4vw, 64px);
  font-weight: 900;
  color: #d4a843;
  text-shadow: 0 0 30px rgba(212,168,67,0.5), 0 0 60px rgba(212,168,67,0.2);
  letter-spacing: 2px;
}
.subtitle {
  font-size: clamp(14px, 1.5vw, 22px);
  color: rgba(255,255,255,0.65);
  margin-top: 8px;
  font-weight: 300;
}

/* Progress dots */
.progress-dots {
  display: flex;
  gap: 14px;
  margin: 20px 0 30px;
  justify-content: center;
}
.progress-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(212,168,67,0.4);
  background: transparent;
  transition: all 0.4s ease;
}
.progress-dot.active {
  border-color: #d4a843;
  box-shadow: 0 0 10px rgba(212,168,67,0.5);
}
.progress-dot.correct {
  background: #d4a843;
  border-color: #d4a843;
  box-shadow: 0 0 12px rgba(212,168,67,0.6);
}
.progress-dot.wrong {
  background: #c0392b;
  border-color: #c0392b;
  box-shadow: 0 0 10px rgba(192,57,43,0.5);
}

/* Game area */
.game-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

/* Data + Circle layout */
.data-circle-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4vw;
  width: 100%;
  min-height: 45vh;
  position: relative;
  margin-bottom: 20px;
}

.data-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 0 0 22vw;
  max-width: 26vw;
}

/* Data clouds */
.data-cloud {
  padding: 2.5vh 2.5vw;
  border-radius: 40% 60% 55% 45% / 50% 40% 60% 50%;
  background: linear-gradient(135deg, rgba(123,47,242,0.12), rgba(80,40,180,0.08));
  border: 1px solid rgba(123,47,242,0.2);
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 20px rgba(123,47,242,0.1), inset 0 0 20px rgba(123,47,242,0.05);
  opacity: 0;
  transform: translateX(-40px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  text-align: center;
  position: relative;
}
.data-cloud.from-right {
  transform: translateX(40px);
}
.data-cloud.visible {
  opacity: 1;
  transform: translateX(0);
}
.data-cloud.hint-cloud {
  background: linear-gradient(135deg, rgba(46,204,113,0.12), rgba(39,174,96,0.08));
  border-color: rgba(46,204,113,0.25);
  box-shadow: 0 4px 20px rgba(46,204,113,0.1);
  padding: 16px 20px;
}
/* Animation handled by spiral-in-left / spiral-in-right classes */

@keyframes cloudFloat {
  0%, 100% { transform: translateY(0px) rotate(-1deg); }
  33% { transform: translateY(-8px) rotate(1deg); }
  66% { transform: translateY(-3px) rotate(-0.5deg); }
}

/* Data cloud entrance spiral */
@keyframes cloudSpiralLeft {
  0% { opacity: 0; transform: translate(-80px, -40px) rotate(-15deg) scale(0.5); }
  60% { opacity: 0.8; transform: translate(10px, 5px) rotate(3deg) scale(1.05); }
  100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
}
@keyframes cloudSpiralRight {
  0% { opacity: 0; transform: translate(80px, -40px) rotate(15deg) scale(0.5); }
  60% { opacity: 0.8; transform: translate(-10px, 5px) rotate(-3deg) scale(1.05); }
  100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
}
.data-cloud.spiral-in-left {
  animation: cloudSpiralLeft 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, cloudFloat 3.5s ease-in-out 0.8s infinite;
}
.data-cloud.spiral-in-right {
  animation: cloudSpiralRight 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, cloudFloat 3.5s ease-in-out 0.8s infinite;
}

.data-label {
  font-size: clamp(12px, 1.2vw, 18px);
  color: rgba(123,47,242,0.9);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  display: block;
  margin-bottom: 2px;
}
.data-value {
  font-size: clamp(16px, 1.8vw, 26px);
  color: #d4a843;
  font-weight: 700;
  font-family: 'Cinzel', serif;
}
.hint-cloud .data-label {
  color: rgba(46,204,113,0.9);
}
.hint-cloud .data-value {
  color: #2ecc71;
  font-family: 'Inter', sans-serif;
  font-size: clamp(13px, 1.3vw, 18px);
  font-weight: 400;
}

/* Mystery circle */
.mystery-circle-wrapper {
  position: relative;
  width: clamp(240px, 28vw, 480px);
  height: clamp(240px, 28vw, 480px);
  flex-shrink: 0;
}
.mystery-circle {
  width: clamp(240px, 28vw, 480px);
  height: clamp(240px, 28vw, 480px);
  border-radius: 50%;
  border: 2px dashed rgba(212,168,67,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  animation: circlePulse 3s ease-in-out infinite;
  transition: transform 0.5s ease, opacity 0.5s ease;
}
.mystery-circle .question-mark {
  font-family: 'Cinzel', serif;
  font-size: clamp(80px, 10vw, 160px);
  font-weight: 900;
  color: #d4a843;
  text-shadow: 0 0 30px rgba(212,168,67,0.5), 0 0 60px rgba(212,168,67,0.2);
  transition: opacity 0.8s ease, color 0.3s ease;
  user-select: none;
  position: relative;
  z-index: 2;
}

@keyframes circlePulse {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1.0); }
  25% { transform: translate(8px, -12px) rotate(2deg) scale(1.03); }
  50% { transform: translate(-5px, -18px) rotate(-1deg) scale(1.05); }
  75% { transform: translate(-10px, -6px) rotate(1.5deg) scale(1.02); }
}

/* Orbiting particles canvas */
#orbitCanvas {
  position: absolute;
  top: -40px;
  left: -40px;
  pointer-events: none;
  z-index: 1;
}

/* Nebula canvas inside circle */
#nebulaCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: clamp(240px, 28vw, 480px);
  height: clamp(240px, 28vw, 480px);
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
}

/* Gravitational wave rings */
.grav-wave {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  border: 2px solid rgba(212,168,67,0.6);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 0;
  animation: gravWaveExpand 1.2s ease-out forwards;
}
@keyframes gravWaveExpand {
  0% { width: 50px; height: 50px; opacity: 0.8; border-width: 3px; }
  100% { width: 600px; height: 600px; opacity: 0; border-width: 1px; }
}

/* Crayon canvas overlay */
#crayonCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: clamp(240px, 28vw, 480px);
  height: clamp(240px, 28vw, 480px);
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
}
#crayonSmoothCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: clamp(240px, 28vw, 480px);
  height: clamp(240px, 28vw, 480px);
  border-radius: 50%;
  pointer-events: none;
  z-index: 4;
  opacity: 0;
  transition: opacity 0.5s ease;
}

/* Object name reveal */
.object-name {
  font-family: 'Cinzel', serif;
  font-size: 28px;
  font-weight: 700;
  color: #d4a843;
  text-shadow: 0 0 20px rgba(212,168,67,0.4);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.5s ease;
  margin-top: 15px;
  text-align: center;
}
.object-name.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Fun fact cloud */
.fun-fact-cloud {
  max-width: 500px;
  padding: 20px 28px;
  border-radius: 40% 60% 55% 45% / 50% 40% 60% 50%;
  background: linear-gradient(135deg, rgba(212,168,67,0.08), rgba(123,47,242,0.06));
  border: 1px solid rgba(212,168,67,0.2);
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 30px rgba(212,168,67,0.1);
  text-align: center;
  font-size: 15px;
  line-height: 1.6;
  color: rgba(255,255,255,0.9);
  margin-top: 15px;
  opacity: 0;
  transform: translateY(15px);
  transition: all 0.5s ease;
}
.fun-fact-cloud.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Answer options */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 20px;
  width: 100%;
  max-width: 60vw;
  opacity: 0;
  transform: translateY(15px);
  transition: all 0.5s ease;
}
.options-grid.visible {
  opacity: 1;
  transform: translateY(0);
}

.option-btn {
  padding: 1.5vh 2vw;
  font-family: 'Inter', sans-serif;
  font-size: clamp(14px, 1.4vw, 20px);
  font-weight: 600;
  color: #ffffff;
  background: rgba(123,47,242,0.08);
  border: 2px solid rgba(123,47,242,0.35);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(6px);
  position: relative;
  overflow: hidden;
}
.option-btn:hover:not(:disabled) {
  border-color: rgba(123,47,242,0.7);
  box-shadow: 0 0 20px rgba(123,47,242,0.2);
  background: rgba(123,47,242,0.15);
  transform: translateY(-2px);
}
.option-btn.correct {
  border-color: #d4a843 !important;
  background: rgba(212,168,67,0.15) !important;
  box-shadow: 0 0 25px rgba(212,168,67,0.3) !important;
  color: #d4a843 !important;
}
.option-btn.wrong {
  border-color: #e74c3c !important;
  background: rgba(231,76,60,0.12) !important;
  animation: shakeBtn 0.5s ease;
}
.option-btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

@keyframes shakeBtn {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
@keyframes shakeCircle {
  0%, 100% { transform: translateX(0) scale(1); }
  20% { transform: translateX(-6px) scale(1); }
  40% { transform: translateX(6px) scale(1); }
  60% { transform: translateX(-4px) scale(1); }
  80% { transform: translateX(4px) scale(1); }
}

/* Wrong feedback text */
.wrong-feedback {
  color: #e74c3c;
  font-size: 14px;
  font-weight: 600;
  margin-top: 10px;
  opacity: 0;
  transition: opacity 0.3s ease;
  text-align: center;
}
.wrong-feedback.visible {
  opacity: 1;
}

/* Next button */
.next-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 36px;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: #1a1040;
  background: linear-gradient(135deg, #d4a843, #f0c860);
  border: none;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(212,168,67,0.3);
  transition: all 0.3s ease;
  opacity: 0;
  transform: translateY(10px);
}
.next-btn.visible {
  opacity: 1;
  transform: translateY(0);
}
.next-btn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 6px 30px rgba(212,168,67,0.4);
}

/* End screen */
.end-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 40px;
}
.end-screen.active {
  display: flex;
}
.end-title {
  font-family: 'Cinzel', serif;
  font-size: 40px;
  font-weight: 900;
  color: #d4a843;
  text-shadow: 0 0 30px rgba(212,168,67,0.5);
  margin-bottom: 20px;
}
.end-score {
  font-size: 20px;
  color: rgba(255,255,255,0.85);
  margin-bottom: 12px;
}
.end-message {
  font-size: 16px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 30px;
  max-width: 400px;
  line-height: 1.5;
}

#celebrationCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 50;
  pointer-events: none;
}

/* Responsive */
@media (max-width: 700px) {
  .data-circle-row {
    flex-direction: column;
    gap: 20px;
    min-height: auto;
  }
  .data-column {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    flex: auto;
    max-width: 100%;
  }
  .data-cloud { padding: 10px 14px; }
  .mystery-circle-wrapper { order: -1; }
  .title { font-size: 30px; }
  .mystery-circle-wrapper, .mystery-circle, #crayonCanvas, #crayonSmoothCanvas, #nebulaCanvas {
    width: 220px;
    height: 220px;
  }
  .mystery-circle .question-mark { font-size: 70px; }
}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<canvas id="celebrationCanvas"></canvas>

<div class="container">
  <a href="index.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Volver
  </a>

  <div class="title-area">
    <h1 class="title">Analiza y Descubre</h1>
    <p class="subtitle">Analiza los datos del telescopio e identifica el objeto misterioso</p>
  </div>

  <div class="progress-dots" id="progressDots">
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
  </div>

  <div class="game-area" id="gameArea">
    <div class="data-circle-row">
      <div class="data-column" id="dataLeft"></div>

      <div class="mystery-circle-wrapper">
        <canvas id="orbitCanvas"></canvas>
        <canvas id="nebulaCanvas"></canvas>
        <div class="mystery-circle" id="mysteryCircle">
          <span class="question-mark" id="questionMark">?</span>
        </div>
        <canvas id="crayonCanvas"></canvas>
        <canvas id="crayonSmoothCanvas"></canvas>
      </div>

      <div class="data-column" id="dataRight"></div>
    </div>

    <div class="object-name" id="objectName"></div>
    <div class="fun-fact-cloud" id="funFact"></div>

    <div class="options-grid" id="optionsGrid"></div>
    <div class="wrong-feedback" id="wrongFeedback">¡Intentalo de nuevo!</div>

    <button class="next-btn" id="nextBtn" onclick="nextRound()">Siguiente &gt;</button>
  </div>

  <div class="end-screen" id="endScreen">
    <h2 class="end-title">¡Mision Completada!</h2>
    <p class="end-score" id="endScore"></p>
    <p class="end-message" id="endMessage"></p>
    <button class="next-btn visible" onclick="location.href='index.html'" style="opacity:1;transform:none;">Volver al inicio</button>
  </div>
</div>

<script>
// ========== STARFIELD ==========
(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  const STAR_COUNT = 200;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      alpha: Math.random(),
      speed: Math.random() * 0.3 + 0.05,
      twinkleSpeed: Math.random() * 0.015 + 0.005,
      twinkleDir: Math.random() > 0.5 ? 1 : -1
    });
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.alpha += s.twinkleSpeed * s.twinkleDir;
      if (s.alpha >= 1) { s.alpha = 1; s.twinkleDir = -1; }
      if (s.alpha <= 0.1) { s.alpha = 0.1; s.twinkleDir = 1; }
      s.y += s.speed;
      if (s.y > canvas.height + 5) { s.y = -5; s.x = Math.random() * canvas.width; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();
})();

// ========== ORBITING PARTICLES ==========
const orbitCanvas = document.getElementById('orbitCanvas');
const orbitCtx = orbitCanvas.getContext('2d');
let orbitParticles = [];
let orbitAnimId = null;

function initOrbitCanvas() {
  const wrapper = document.querySelector('.mystery-circle-wrapper');
  const sz = wrapper ? wrapper.offsetWidth : 280;
  orbitCanvas.width = sz + 80;
  orbitCanvas.height = sz + 80;
  orbitCanvas.style.width = (sz + 80) + 'px';
  orbitCanvas.style.height = (sz + 80) + 'px';
}

function spawnOrbitParticles() {
  orbitParticles = [];
  const count = 35;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
    const dist = 0.42 + Math.random() * 0.15;
    orbitParticles.push({
      angle,
      dist,
      speed: (0.004 + Math.random() * 0.008) * (Math.random() > 0.5 ? 1 : -1),
      r: Math.random() * 2.5 + 0.8,
      alpha: Math.random() * 0.6 + 0.3,
      color: Math.random() > 0.6 ? '#d4a843' : (Math.random() > 0.5 ? '#7B2FF2' : '#ffffff'),
      twinkle: Math.random() * 0.02 + 0.005,
      twinkleDir: 1,
      trail: []
    });
  }
}

function animateOrbit() {
  const w = orbitCanvas.width;
  const h = orbitCanvas.height;
  const cx = w / 2;
  const cy = h / 2;

  orbitCtx.clearRect(0, 0, w, h);

  for (const p of orbitParticles) {
    p.angle += p.speed;
    p.alpha += p.twinkle * p.twinkleDir;
    if (p.alpha > 0.9) { p.alpha = 0.9; p.twinkleDir = -1; }
    if (p.alpha < 0.15) { p.alpha = 0.15; p.twinkleDir = 1; }

    const rx = cx * p.dist;
    const ry = cy * p.dist * 0.85;
    const x = cx + Math.cos(p.angle) * rx;
    const y = cy + Math.sin(p.angle) * ry;

    // Trail
    p.trail.push({ x, y, alpha: p.alpha * 0.5 });
    if (p.trail.length > 6) p.trail.shift();

    for (let t = 0; t < p.trail.length; t++) {
      const tr = p.trail[t];
      const trAlpha = tr.alpha * (t / p.trail.length) * 0.4;
      orbitCtx.beginPath();
      orbitCtx.arc(tr.x, tr.y, p.r * 0.6, 0, Math.PI * 2);
      orbitCtx.fillStyle = p.color.replace(')', `,${trAlpha})`).replace('rgb', 'rgba').replace('#', '');
      // Use hex to rgba for simplicity
      const rgb = hexToRgbValues(p.color);
      orbitCtx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${trAlpha})`;
      orbitCtx.fill();
    }

    // Main particle with glow
    orbitCtx.save();
    orbitCtx.shadowColor = p.color;
    orbitCtx.shadowBlur = 8;
    orbitCtx.beginPath();
    orbitCtx.arc(x, y, p.r, 0, Math.PI * 2);
    const rgb2 = hexToRgbValues(p.color);
    orbitCtx.fillStyle = `rgba(${rgb2.r},${rgb2.g},${rgb2.b},${p.alpha})`;
    orbitCtx.fill();
    orbitCtx.restore();
  }

  orbitAnimId = requestAnimationFrame(animateOrbit);
}

function hexToRgbValues(hex) {
  if (hex.startsWith('#')) {
    return {
      r: parseInt(hex.slice(1,3), 16),
      g: parseInt(hex.slice(3,5), 16),
      b: parseInt(hex.slice(5,7), 16)
    };
  }
  return { r: 255, g: 255, b: 255 };
}

// ========== NEBULA SWIRL ==========
const nebulaCanvas = document.getElementById('nebulaCanvas');
const nebulaCtx = nebulaCanvas.getContext('2d');
let nebulaTime = 0;
let nebulaAnimId = null;
let nebulaActive = true;

function initNebulaCanvas() {
  const wrapper = document.querySelector('.mystery-circle-wrapper');
  const sz = wrapper ? wrapper.offsetWidth : 280;
  nebulaCanvas.width = sz;
  nebulaCanvas.height = sz;
}

function animateNebula() {
  if (!nebulaActive) { nebulaAnimId = requestAnimationFrame(animateNebula); return; }
  const sz = nebulaCanvas.width;
  const cx = sz / 2;
  const cy = sz / 2;
  const radius = sz / 2 - 2;
  nebulaTime += 0.008;

  nebulaCtx.clearRect(0, 0, sz, sz);
  nebulaCtx.save();
  nebulaCtx.beginPath();
  nebulaCtx.arc(cx, cy, radius, 0, Math.PI * 2);
  nebulaCtx.clip();

  // Draw swirling nebula arms
  const arms = 3;
  for (let a = 0; a < arms; a++) {
    const baseAngle = (Math.PI * 2 / arms) * a + nebulaTime;
    for (let i = 0; i < 12; i++) {
      const t = i / 12;
      const spiralAngle = baseAngle + t * Math.PI * 1.5;
      const dist = t * radius * 0.85;
      const x = cx + Math.cos(spiralAngle) * dist;
      const y = cy + Math.sin(spiralAngle) * dist;
      const size = (1 - t) * radius * 0.4 + 10;

      const grad = nebulaCtx.createRadialGradient(x, y, 0, x, y, size);
      const hue = (a * 120 + i * 10 + nebulaTime * 30) % 360;
      grad.addColorStop(0, `hsla(${hue}, 70%, 50%, 0.06)`);
      grad.addColorStop(0.5, `hsla(${hue + 30}, 60%, 40%, 0.03)`);
      grad.addColorStop(1, 'transparent');

      nebulaCtx.fillStyle = grad;
      nebulaCtx.beginPath();
      nebulaCtx.arc(x, y, size, 0, Math.PI * 2);
      nebulaCtx.fill();
    }
  }

  // Central glow
  const centerGrad = nebulaCtx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.4);
  const pulse = Math.sin(nebulaTime * 2) * 0.03 + 0.07;
  centerGrad.addColorStop(0, `rgba(212, 168, 67, ${pulse})`);
  centerGrad.addColorStop(1, 'transparent');
  nebulaCtx.fillStyle = centerGrad;
  nebulaCtx.fillRect(0, 0, sz, sz);

  nebulaCtx.restore();
  nebulaAnimId = requestAnimationFrame(animateNebula);
}

// ========== EXPLOSION / REFORM TRANSITION ==========
let transitionParticles = [];
let transitionAnimId = null;

function explodeCircle(callback) {
  const wrapper = document.querySelector('.mystery-circle-wrapper');
  const sz = wrapper.offsetWidth;
  const cx = sz / 2;
  const cy = sz / 2;

  // Create temp canvas for explosion
  const expCanvas = document.createElement('canvas');
  expCanvas.width = sz + 100;
  expCanvas.height = sz + 100;
  expCanvas.style.cssText = `position:absolute;top:-50px;left:-50px;width:${sz+100}px;height:${sz+100}px;pointer-events:none;z-index:10;`;
  wrapper.appendChild(expCanvas);
  const ectx = expCanvas.getContext('2d');

  transitionParticles = [];
  const ecx = expCanvas.width / 2;
  const ecy = expCanvas.height / 2;

  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    const startDist = Math.random() * 20;
    transitionParticles.push({
      x: ecx + Math.cos(angle) * startDist,
      y: ecy + Math.sin(angle) * startDist,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: Math.random() * 4 + 1,
      alpha: 1,
      decay: Math.random() * 0.02 + 0.015,
      color: Math.random() > 0.5 ? '#d4a843' : '#7B2FF2'
    });
  }

  function animateExplosion() {
    ectx.clearRect(0, 0, expCanvas.width, expCanvas.height);
    let alive = false;
    for (const p of transitionParticles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.97;
      p.vy *= 0.97;
      p.alpha -= p.decay;
      if (p.alpha <= 0) continue;
      alive = true;
      const rgb = hexToRgbValues(p.color);
      ectx.beginPath();
      ectx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ectx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${p.alpha})`;
      ectx.fill();
    }
    if (alive) {
      requestAnimationFrame(animateExplosion);
    } else {
      expCanvas.remove();
      if (callback) callback();
    }
  }
  requestAnimationFrame(animateExplosion);
}

// ========== CRAYON ANIMATION ==========
function startCrayonAnimation(round) {
  const sz = getCircleSize();
  const radius = sz / 2 - 2;
  const cx = sz / 2;
  const cy = sz / 2;
  const ctx = crayonCtx;

  // Setup clip
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.clip();

  const numStrokes = 8;
  const strokeHeight = (sz * 0.85) / numStrokes;
  const startY = sz * 0.08;
  const crayonColor = round.crayon;
  const fillColors = round.fill;

  // Crayon properties
  const crayonW = 80;
  const crayonH = 18;

  let currentStroke = 0;
  let strokeProgress = 0; // 0 to 1
  const strokeSpeed = 0.055;

  function getStrokeX(progress, strokeIdx) {
    const goingRight = strokeIdx % 2 === 0;
    const margin = 10;
    const startX = goingRight ? margin : sz - margin;
    const endX = goingRight ? sz - margin : margin;
    return startX + (endX - startX) * progress;
  }

  function getStrokeY(strokeIdx) {
    return startY + strokeIdx * strokeHeight + strokeHeight / 2;
  }

  function drawCrayonStrokes(upToStroke, upToProgress) {
    // Don't clear — rebuild each frame for simplicity, but we save perf by only drawing new stuff
    // Actually, clear and redraw is fine at this scale
    ctx.clearRect(0, 0, sz, sz);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.clip();

    for (let s = 0; s <= upToStroke && s < numStrokes; s++) {
      const prog = (s < upToStroke) ? 1.0 : upToProgress;
      const y = getStrokeY(s);
      const goingRight = s % 2 === 0;
      const margin = 10;
      const startX = goingRight ? margin : sz - margin;
      const endX = goingRight ? sz - margin : margin;
      const currentX = startX + (endX - startX) * prog;

      // Draw multiple sub-lines for crayon texture
      for (let line = 0; line < 5; line++) {
        const offsetY = (line - 2) * 4 + (Math.random() - 0.5) * 2;
        const alpha = 0.15 + Math.random() * 0.15;
        ctx.beginPath();
        ctx.moveTo(startX, y + offsetY);

        // Add wobble points
        const steps = 8;
        for (let p = 1; p <= steps; p++) {
          const frac = p / steps;
          if (frac > prog) break;
          const px = startX + (endX - startX) * frac;
          const py = y + offsetY + (Math.random() - 0.5) * 2;
          ctx.lineTo(px, py);
        }

        ctx.strokeStyle = hexToRgba(crayonColor, alpha);
        ctx.lineWidth = 4 + Math.random() * 2;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawCrayon(x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    // Body
    const bx = -crayonW / 2;
    const by = -crayonH / 2;
    const bodyGrad = ctx.createLinearGradient(bx, by, bx, by + crayonH);
    bodyGrad.addColorStop(0, lightenColor(crayonColor, 30));
    bodyGrad.addColorStop(0.5, crayonColor);
    bodyGrad.addColorStop(1, darkenColor(crayonColor, 20));
    ctx.fillStyle = bodyGrad;
    roundRect(ctx, bx + 12, by, crayonW - 12, crayonH, 3);
    ctx.fill();

    // Wrapper band (middle third)
    const wrapX = bx + 12 + (crayonW - 12) * 0.3;
    const wrapW = (crayonW - 12) * 0.4;
    ctx.fillStyle = lightenColor(crayonColor, 50);
    ctx.globalAlpha = 0.4;
    ctx.fillRect(wrapX, by + 1, wrapW, crayonH - 2);
    ctx.globalAlpha = 1.0;

    // Tip (triangle on the left side = drawing end)
    ctx.shadowColor = 'transparent';
    ctx.beginPath();
    ctx.moveTo(bx + 12, by);
    ctx.lineTo(bx, by + crayonH / 2);
    ctx.lineTo(bx + 12, by + crayonH);
    ctx.closePath();
    ctx.fillStyle = darkenColor(crayonColor, 40);
    ctx.fill();

    ctx.restore();
  }

  function animate() {
    if (currentStroke >= numStrokes) {
      // Done coloring
      ctx.restore();
      finishColoring(round);
      return;
    }

    strokeProgress += strokeSpeed;
    if (strokeProgress > 1) {
      strokeProgress = 0;
      currentStroke++;
      if (currentStroke >= numStrokes) {
        drawCrayonStrokes(numStrokes - 1, 1);
        finishColoring(round);
        return;
      }
    }

    // Fade the question mark as we progress
    const totalProgress = (currentStroke + strokeProgress) / numStrokes;
    questionMark.style.opacity = Math.max(0, 1 - totalProgress * 1.3);

    drawCrayonStrokes(currentStroke, strokeProgress);

    // Draw crayon
    const crayX = getStrokeX(strokeProgress, currentStroke);
    const crayY = getStrokeY(currentStroke);
    const angle = currentStroke % 2 === 0 ? -0.5 : 0.5;
    drawCrayon(crayX, crayY, angle);

    requestAnimationFrame(animate);
  }

  // Small delay then start
  setTimeout(() => requestAnimationFrame(animate), 300);
}

function finishColoring(round) {
  const sz = getCircleSize();
  const radius = sz / 2 - 2;
  const cx = sz / 2;

  // Draw smooth gradient on smooth canvas
  smoothCtx.save();
  smoothCtx.beginPath();
  smoothCtx.arc(cx, cx, radius, 0, Math.PI * 2);
  smoothCtx.clip();

  const grad = smoothCtx.createRadialGradient(cx * 0.8, cx * 0.7, 0, cx, cx, radius);
  grad.addColorStop(0, round.fill[0]);
  grad.addColorStop(1, round.fill[1]);
  smoothCtx.fillStyle = grad;
  smoothCtx.fillRect(0, 0, sz, sz);
  smoothCtx.restore();

  // Transition: smooth canvas fades in over crayon texture
  smoothCanvas.style.opacity = '1';

  // Glow pulse on circle
  mysteryCircle.style.animation = 'none';
  mysteryCircle.style.borderColor = 'transparent';
  mysteryCircle.style.boxShadow = `0 0 40px ${round.fill[0]}55, 0 0 80px ${round.fill[1]}33`;

  // Crayon lifts off (clear crayon canvas after a moment to remove the crayon sprite)
  setTimeout(() => {
    // Redraw strokes without crayon
    crayonCtx.clearRect(0, 0, sz, sz);
  }, 200);

  // Show object name
  setTimeout(() => {
    objectNameEl.textContent = round.name;
    objectNameEl.classList.add('visible');
  }, 500);

  // Show fun fact
  setTimeout(() => {
    funFactEl.textContent = round.fact;
    funFactEl.classList.add('visible');
  }, 900);

  // Show next button
  setTimeout(() => {
    nextBtn.classList.add('visible');
  }, 1200);
}

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        mysteryCircle.style.transition = 'transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease';
        mysteryCircle.style.transform = 'scale(1) rotate(0deg)';
        mysteryCircle.style.opacity = '1';
      });
    });
  }, 900);
}

// ========== END SCREEN ==========
function showEndScreen() {
  gameArea.style.display = 'none';
  document.querySelector('.progress-dots').style.display = 'none';
  endScreen.classList.add('active');
  document.getElementById('endScore').textContent = `Descubriste ${score} de 5 objetos al primer intento`;

  let msg;
  if (score === 5) msg = '¡Perfecto! Eres un verdadero astrofisico. ¡Impresionante dominio del cosmos!';
  else if (score >= 4) msg = '¡Excelente! Casi perfecto. ¡Tienes un gran conocimiento del universo!';
  else if (score >= 3) msg = '¡Muy bien! Conoces bastante sobre los objetos estelares.';
  else if (score >= 2) msg = '¡Buen intento! Sigue explorando el universo y aprenderas mas.';
  else msg = '¡No te rindas! El universo es inmenso y hay mucho por descubrir.';

  document.getElementById('endMessage').textContent = msg;
  startCelebration();
}

// ========== CELEBRATION PARTICLES ==========
function startCelebration() {
  const canvas = document.getElementById('celebrationCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const colors = ['#d4a843', '#f0c860', '#7B2FF2', '#e74c3c', '#2ecc71', '#ffffff', '#00B4D8'];

  function burst(x, y) {
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        r: Math.random() * 3 + 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: Math.random() * 0.015 + 0.008,
        gravity: 0.06
      });
    }
  }

  // Multiple bursts
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      burst(
        Math.random() * canvas.width * 0.6 + canvas.width * 0.2,
        Math.random() * canvas.height * 0.4 + canvas.height * 0.1
      );
    }, i * 400);
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.alpha -= p.decay;
      if (p.alpha <= 0) { particles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) requestAnimationFrame(animateParticles);
  }
  requestAnimationFrame(animateParticles);
}

// ========== UTILITY FUNCTIONS ==========
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function lightenColor(hex, amount) {
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.min(255, r + amount);
  g = Math.min(255, g + amount);
  b = Math.min(255, b + amount);
  return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, amount) {
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.max(0, r - amount);
  g = Math.max(0, g - amount);
  b = Math.max(0, b - amount);
  return `rgb(${r},${g},${b})`;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ========== INIT ==========
startRound();
