<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analiza y Descubre</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1040 40%, #2d1b69 100%);
  font-family: 'Inter', sans-serif;
  color: #ffffff;
  overflow-x: hidden;
  position: relative;
}

canvas#starfield {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* Nebula glows */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  z-index: 0;
  pointer-events: none;
}
body::before {
  width: 600px; height: 600px;
  background: radial-gradient(circle, #ff3cac, transparent 70%);
  top: -150px; right: -150px;
}
body::after {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #7b2ff2, transparent 70%);
  bottom: -100px; left: -100px;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

/* Back button */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #d4a843;
  text-decoration: none;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  padding: 10px 20px;
  border: 1px solid rgba(212,168,67,0.3);
  border-radius: 12px;
  background: rgba(212,168,67,0.05);
  transition: all 0.3s;
  margin-bottom: 30px;
}
.back-btn:hover {
  background: rgba(212,168,67,0.15);
  border-color: rgba(212,168,67,0.6);
  box-shadow: 0 0 20px rgba(212,168,67,0.15);
}

/* Title */
.game-title {
  font-family: 'Cinzel', serif;
  font-size: 2.8rem;
  font-weight: 900;
  color: #d4a843;
  text-align: center;
  margin-bottom: 10px;
  text-shadow: 0 0 30px rgba(212,168,67,0.5), 0 0 60px rgba(212,168,67,0.25);
  animation: titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% { text-shadow: 0 0 30px rgba(212,168,67,0.5), 0 0 60px rgba(212,168,67,0.25); }
  50% { text-shadow: 0 0 40px rgba(212,168,67,0.8), 0 0 80px rgba(212,168,67,0.4), 0 0 120px rgba(212,168,67,0.2); }
}

.subtitle {
  text-align: center;
  color: rgba(255,255,255,0.6);
  font-size: 1.05rem;
  margin-bottom: 35px;
  font-weight: 300;
}

/* Progress bar */
.progress-bar {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 40px;
}
.progress-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  transition: all 0.5s;
  position: relative;
}
.progress-dot.active {
  background: #d4a843;
  border-color: #d4a843;
  box-shadow: 0 0 12px rgba(212,168,67,0.6);
}
.progress-dot.completed {
  background: #4ade80;
  border-color: #4ade80;
  box-shadow: 0 0 10px rgba(74,222,128,0.5);
}
.progress-dot.active::after {
  content: '';
  position: absolute;
  top: -4px; left: -4px; right: -4px; bottom: -4px;
  border-radius: 50%;
  border: 2px solid rgba(212,168,67,0.4);
  animation: dotPulse 1.5s ease-in-out infinite;
}
@keyframes dotPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0; }
}

/* Round container */
.round-container {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.6s, transform 0.6s;
}
.round-container.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Round header */

  margin-bottom: 25px;
}
.round-label {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;

  letter-spacing: 3px;

}
.round-title {

  font-size: 1.8rem;

  animation: iconPulse 2s ease-in-out infinite;

@keyframes iconPulse {

  50% { box-shadow: 0 0 25px rgba(123,47,242,0.6); transform: scale(1.05); }
}

/* Terminal / Data panel */
.terminal {

  border: 1px solid rgba(123,47,242,0.3);
  border-radius: 16px;

  margin-bottom: 30px;

.terminal-bar {

  gap: 8px;

  background: rgba(123,47,242,0.08);
  border-bottom: 1px solid rgba(123,47,242,0.15);

.terminal-dot {

.terminal-label {

}
.terminal-body {

}
.data-line {

}

}
.data-value {

}

.cursor {

}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }

/* Options */

  padding: 16px 20px;

  border-radius: 14px;
  background: rgba(123,47,242,0.08);
  color: #fff;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.option-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(123,47,242,0.1), transparent);

}
.option-btn:hover:not(.disabled) {

  box-shadow: 0 0 25px rgba(123,47,242,0.2);

.option-btn:hover::before { left: 100%; }

  background: rgba(212,168,67,0.2) !important;
  box-shadow: 0 0 30px rgba(212,168,67,0.4) !important;
  color: #d4a843;
  animation: correctPop 0.4s ease-out;
}
@keyframes correctPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
.option-btn.wrong {
  border-color: #ef4444 !important;
  background: rgba(239,68,68,0.15) !important;
  animation: shake 0.5s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}
.option-btn.disabled {

  opacity: 0.4;

/* Feedback area */
.feedback {

.feedback-correct {

/* Next / action buttons */
.next-btn {

  font-weight: 700;
  color: #0a0e27;
  background: linear-gradient(135deg, #d4a843, #f0cc6b);
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.3s;

.next-btn:hover {

/* End screen */
.end-screen {

  transition: opacity 0.8s, transform 0.8s;

.end-screen.visible {

.end-title {
  font-family: 'Cinzel', serif;
  font-size: 2.6rem;
  font-weight: 900;
  color: #d4a843;
  text-shadow: 0 0 30px rgba(212,168,67,0.5), 0 0 60px rgba(212,168,67,0.3);

}
.end-score {
  font-size: 1.3rem;
  color: rgba(255,255,255,0.8);
  margin-bottom: 12px;
}
.end-score span {
  color: #d4a843;

  font-size: 1.6rem;

.end-message {

.end-btn {
  display: inline-block;
  padding: 16px 50px;
  font-family: 'Inter', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: #0a0e27;
  background: linear-gradient(135deg, #d4a843, #f0cc6b);

  border-radius: 14px;

.end-btn:hover {

canvas#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  pointer-events: none;

/* Responsive */
@media (max-width: 600px) {
  .game-title { font-size: 2rem; }

</style>

<script>
// === STARFIELD ===
(function() {
  const c = document.getElementById('starfield');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  function init() {
    resize();
    stars = [];
    const count = Math.floor((c.width * c.height) / 3000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random() * 0.8 + 0.2,
        dx: (Math.random() - 0.5) * 0.15,
        dy: (Math.random() - 0.5) * 0.1,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        twinkleOffset: Math.random() * Math.PI * 2
      });
    }
  }
  let time = 0;
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    time += 1;
    for (const s of stars) {
      s.x += s.dx;
      s.y += s.dy;
      if (s.x < 0) s.x = c.width;
      if (s.x > c.width) s.x = 0;
      if (s.y < 0) s.y = c.height;
      if (s.y > c.height) s.y = 0;
      const alpha = s.a * (0.6 + 0.4 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  init();
  draw();
  window.addEventListener('resize', init);
})();

// === PARTICLE SYSTEM (celebrations) ===
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let particles = [];
function resizeParticles() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
resizeParticles();
window.addEventListener('resize', resizeParticles);

function spawnBurst(x, y, count, colors) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1,
      decay: Math.random() * 0.015 + 0.008,
      r: Math.random() * 4 + 2,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function spawnFireworks() {
  const count = 5;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const x = Math.random() * pCanvas.width * 0.6 + pCanvas.width * 0.2;
      const y = Math.random() * pCanvas.height * 0.4 + pCanvas.height * 0.1;
      spawnBurst(x, y, 60, ['#d4a843','#f0cc6b','#7b2ff2','#ff3cac','#4ade80','#ffffff']);
    }, i * 400);
  }
}

function spawnCorrectBurst() {
  const rect = document.getElementById('gameArea').getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;
  spawnBurst(x, y, 40, ['#d4a843','#f0cc6b','#fff5d4','#ffffff']);
}

(function animateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    pCtx.globalAlpha = p.life;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    pCtx.fillStyle = p.color;
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
  requestAnimationFrame(animateParticles);
})();

let currentRound = 0;
let score = 0;
let firstAttempt = [true, true, true, true, true];

// === PROGRESS BAR ===
function renderProgress() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < currentRound) dot.classList.add('completed');
    if (i === currentRound) dot.classList.add('active');
    bar.appendChild(dot);
  }
}

// === TYPING ANIMATION ===
function typeText(element, text, speed, callback) {
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  element.appendChild(cursor);

  function type() {
    if (i < text.length) {
      cursor.before(document.createTextNode(text[i]));
      i++;
      setTimeout(type, speed);
    } else {
      cursor.remove();
      if (callback) callback();
    }
  }
  type();
}

// === RENDER ROUND ===
function renderRound(index) {
  const round = rounds[index];
  const area = document.getElementById('gameArea');
  area.innerHTML = '';

  const container = document.createElement('div');
  container.className = 'round-container';

  // Header
  container.innerHTML = `
    <div class="round-header">
      <div class="round-label">${round.label}</div>
      <div class="round-title">
        <span class="mystery-icon">?</span>
        Objeto Misterioso #${index + 1}
      </div>
    </div>
    <div class="terminal">
      <div class="terminal-bar">
        <div class="terminal-dot"></div>
        <div class="terminal-dot"></div>
        <div class="terminal-dot"></div>
        <span class="terminal-label">TELESCOPIO_ESPACIAL v3.7 // datos_entrantes...</span>
      </div>
      <div class="terminal-body" id="terminalBody"></div>
    </div>
    <div class="options-container" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
  `;

  area.appendChild(container);

  // Trigger visibility
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      container.classList.add('visible');
    });
  });

  // Animate data lines
  const body = document.getElementById('terminalBody');
  const dataLines = round.data.map(d => ({ text: `> ${d.label}: ${d.value}`, isHint: false }));
  dataLines.push({ text: `> Pista especial: "${round.hint}"`, isHint: true });

  let lineIndex = 0;
  function showNextLine() {
    if (lineIndex >= dataLines.length) {
      // Show options after a brief pause
      setTimeout(() => showOptions(round, index), 400);
      return;
    }
    const line = document.createElement('div');
    line.className = 'data-line visible';
    const d = dataLines[lineIndex];

    if (d.isHint) {
      const parts = d.text.split(': ');
      const labelSpan = document.createElement('span');
      labelSpan.className = 'data-label';
      const valueSpan = document.createElement('span');
      valueSpan.className = 'data-hint';
      typeText(line, '', 0, () => {
        line.innerHTML = '';
        typeTextStyled(line, d.text, 25, () => {
          lineIndex++;
          setTimeout(showNextLine, 500);
        }, 'hint');
      });
    } else {
      typeTextStyled(line, d.text, 22, () => {
        lineIndex++;
        setTimeout(showNextLine, 400);
      }, 'data');
    }
    body.appendChild(line);
  }

  setTimeout(showNextLine, 600);
}

function typeTextStyled(element, text, speed, callback, type) {
  // Parse "> Label: Value"
  const colonIdx = text.indexOf(': ');
  const label = text.substring(0, colonIdx + 2);
  const value = text.substring(colonIdx + 2);

  let i = 0;
  const full = text;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  element.appendChild(cursor);

  function step() {
    if (i < full.length) {
      // Rebuild with styled spans
      let html = '';
      const soFar = full.substring(0, i + 1);
      if (i < label.length) {
        html = `<span class="data-label">${soFar}</span>`;
      } else {
        const cls = type === 'hint' ? 'data-hint' : 'data-value';
        html = `<span class="data-label">${label}</span><span class="${cls}">${soFar.substring(label.length)}</span>`;
      }
      element.innerHTML = html;
      element.appendChild(cursor);
      i++;
      setTimeout(step, speed);
    } else {
      cursor.remove();
      if (callback) callback();
    }
  }
  step();
}

function showOptions(round, roundIndex) {
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  round.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(i, roundIndex, btn));
    container.appendChild(btn);
  });
  container.classList.add('visible');
}

function handleAnswer(chosen, roundIndex, btn) {
  const round = rounds[roundIndex];
  const feedback = document.getElementById('feedback');
  const options = document.querySelectorAll('.option-btn');

  if (chosen === round.answer) {
    // Correct
    btn.classList.add('correct');
    options.forEach((o, i) => { if (i !== chosen) o.classList.add('disabled'); });

    spawnCorrectBurst();

    feedback.innerHTML = `
      <div class="feedback-correct">¡Correcto! Es: ${round.options[round.answer]}</div>
      <div class="fun-fact"><strong>Dato curioso:</strong> ${round.funFact}</div>
    `;

    if (!firstAttempt[roundIndex]) {
      // Already failed once, don't count
    } else {
      score++;
    }

    // Next button
    const nextBtn = document.createElement('button');
    nextBtn.className = 'next-btn';
    nextBtn.textContent = roundIndex < 4 ? 'Siguiente >' : '¡Ver Resultados!';
    nextBtn.addEventListener('click', () => {
      currentRound++;
      if (currentRound < 5) {
        renderProgress();
        const area = document.getElementById('gameArea');
        const cont = area.querySelector('.round-container');
        if (cont) {
          cont.classList.remove('visible');
          setTimeout(() => renderRound(currentRound), 500);
        }
      } else {
        showEndScreen();
      }
    });
    feedback.appendChild(nextBtn);

  } else {
    // Wrong
    firstAttempt[roundIndex] = false;
    btn.classList.add('wrong');
    feedback.innerHTML = `<div class="feedback-wrong">¡Inténtalo de nuevo!</div>`;
    setTimeout(() => {
      btn.classList.remove('wrong');
      btn.classList.add('disabled');
    }, 600);
  }
}

function showEndScreen() {
  document.getElementById('gameArea').style.display = 'none';
  renderProgress();

  const end = document.getElementById('endScreen');
  end.style.display = 'block';

  let message = '';
  if (score === 5) message = '¡Eres un auténtico astrofísico! Perfecto.';
  else if (score >= 3) message = '¡Muy bien! Sabes mucho sobre el universo.';
  else message = '¡Buen intento! Sigue explorando el cosmos.';

  end.innerHTML = `
    <div class="end-title">¡Misión Completada!</div>
    <div class="end-score">Descubriste <span>${score}</span> de <span>5</span> objetos al primer intento</div>
    <div class="end-message">${message}</div>
    <a href="index.html" class="end-btn">Volver al inicio</a>
  `;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      end.classList.add('visible');
      spawnFireworks();
      // Extra fireworks waves
      setTimeout(spawnFireworks, 2000);
      setTimeout(spawnFireworks, 4000);
    });
  });
}

// === START ===
renderProgress();
renderRound(0);
</script>
